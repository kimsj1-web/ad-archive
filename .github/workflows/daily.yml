name: 광고 아카이브 자동 업데이트

# 같은 워크플로우가 겹쳐 돌지 않도록: 이미 실행 중이면 새 실행은 그게 끝난 뒤에 진행
# (cancel-in-progress: false → 진행 중인 실행을 죽이지 않고 큐에 대기시킴)
concurrency:
  group: ad-archive-update
  cancel-in-progress: false

on:
  schedule:
    # cron은 UTC 기준. 04:23 KST = 전날 19:23 UTC.
    # ── 매일 04:23 KST: 일광고비·순위만 갱신 (+ 새 불씨 슬랙 알림) ──
    #    토요일 KST(=금요일 UTC, day 5)는 아래 아카이브 cron이 대신 도므로 여기선 제외 → UTC day 0,1,2,3,4,6
    - cron: "23 19 * * 0,1,2,3,4,6"
    # ── 토요일 04:23 KST(=금요일 19:23 UTC, day 5): 위 + 고효율 아카이브(최근 3개월) 주 1회 갱신 ──
    - cron: "23 19 * * 5"

  # ── 수동 실행: 과거 월 아카이빙 등 특정 월 지정용 ──
  workflow_dispatch:
    inputs:
      month_tag:
        description: "월 태그 (예: 26.05) 또는 범위 (예: 26.01~26.05, 최신 달부터 자동 진행) — 비우면 일광고비·순위 탭만 갱신"
        required: false
        default: ""
      media_mode:
        description: "수집 유형 — image(이미지만) / video(영상만) / all(둘 다)"
        required: false
        default: "all"
      date_start:
        description: "성과 조회 시작일 (YYYY-MM-DD) — 비우면 MONTH_TAG 기준 월 1일~오늘"
        required: false
        default: ""
      date_stop:
        description: "성과 조회 종료일 (YYYY-MM-DD)"
        required: false
        default: ""

jobs:
  update-archive:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 최신 상태로 동기화
        # concurrency로 대기했다 실행될 때, 앞 실행이 방금 커밋한 기록(alert_sent.json 등)을
        # 반영하도록 origin/main 최신 상태로 맞춘다 (중복 알림 방지의 핵심)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 광고 데이터 수집 및 HTML 생성
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          MONTH_TAG: ${{ github.event.inputs.month_tag }}
          MEDIA_MODE: ${{ github.event.inputs.media_mode }}
          DATE_START: ${{ github.event.inputs.date_start }}
          DATE_STOP: ${{ github.event.inputs.date_stop }}
          # 토요일 04:23 KST(=금요일 19:23 UTC) 스케줄로 돌 때만 아카이브 자동 갱신 (주 1회)
          AUTO_ARCHIVE: ${{ github.event.schedule == '23 19 * * 5' && 'yes' || '' }}
        run: python fetch_ads.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A index.html archive.json images/
          if [ -f tabs_cache.json ]; then git add tabs_cache.json; fi
          if [ -f fire_seen.json ]; then git add fire_seen.json; fi
          if [ -f alert_sent.json ]; then git add alert_sent.json; fi
          TAG="${{ github.event.inputs.month_tag }}"
          [ -z "$TAG" ] && TAG="자동갱신"
          git diff --staged --quiet || git commit -m "chore: [$TAG] 광고 아카이브 업데이트 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          git push
