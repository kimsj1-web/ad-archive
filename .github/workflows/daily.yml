name: 광고 아카이브 자동 업데이트

# 같은 워크플로우가 겹쳐 돌지 않도록: 이미 실행 중이면 새 실행은 그게 끝난 뒤에 진행
# (cancel-in-progress: false → 진행 중인 실행을 죽이지 않고 큐에 대기시킴)
concurrency:
  group: ad-archive-update
  cancel-in-progress: false

on:
  # ── 주 트리거: 외부 스케줄러(cron-job.org 등)가 정시에 이 이벤트로 깨움 ──
  #    GitHub 내부 cron은 수시간씩 밀리므로, 정확한 시각은 외부 호출로 보장한다.
  repository_dispatch:
    types: [external-trigger]

  schedule:
    # ── 백업용 GitHub 내부 cron (밀릴 수 있음). 04:23 KST = 전날 19:23 UTC, 매일 ──
    - cron: "23 19 * * *"

  # ── 수동 실행: 과거 월 아카이빙 등 특정 월 지정용 ──
  workflow_dispatch:
    inputs:
      month_tag:
        description: "월 태그 (예: 26.05) 또는 범위 (예: 26.01~26.05, 최신 달부터 자동 진행) — 비우면 일광고비·순위 탭만 갱신"
        required: false
        default: ""
      media_mode:
        description: "수집 유형 — image(이미지만) / video(영상만) / all(둘 다)"
        required: false
        default: "all"
      date_start:
        description: "성과 조회 시작일 (YYYY-MM-DD) — 비우면 MONTH_TAG 기준 월 1일~오늘"
        required: false
        default: ""
      date_stop:
        description: "성과 조회 종료일 (YYYY-MM-DD)"
        required: false
        default: ""

jobs:
  update-archive:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 최신 상태로 동기화
        # concurrency로 대기했다 실행될 때, 앞 실행이 방금 커밋한 기록(alert_sent.json 등)을
        # 반영하도록 origin/main 최신 상태로 맞춘다 (중복 알림 방지의 핵심)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: 백업 중복 실행 방지 (external 성공 시 Scheduled 스킵)
        # schedule(내부 cron 백업)로 돌 때, 오늘(KST) 이미 '자동갱신' 커밋이 있으면
        # external-trigger가 이미 처리한 것이므로 이번 백업은 통째로 건너뛴다.
        #  - repository_dispatch(external) / workflow_dispatch(수동)은 항상 실행 (skip=no)
        #  - '자동갱신' 커밋은 external/백업 실행만 남기므로, 수동 월 아카이빙 커밋과는 구분됨
        id: skipcheck
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "→ ${{ github.event_name }} 실행 → 정상 진행"
            echo "skip=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          # 오늘(KST) 00:00 이후 커밋만 가볍게 받아와 확인 (shallow 유지, 실패 시 일반 fetch로 폴백)
          git fetch origin main --shallow-since="$TODAY 00:00:00 +0900" 2>/dev/null || git fetch origin main
          if git log origin/main --since="$TODAY 00:00:00 +0900" --grep="자동갱신" --oneline | grep -q .; then
            echo "→ 오늘 이미 자동갱신 완료됨 (external 성공) → 백업 스킵"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          else
            echo "→ 오늘 자동갱신 기록 없음 → 백업 실행"
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Python 설치
        if: steps.skipcheck.outputs.skip != 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        if: steps.skipcheck.outputs.skip != 'yes'
        run: pip install requests

      - name: 아카이브 갱신 여부 결정 (KST 토요일만, 수동 실행 제외)
        # 외부 트리거/스케줄로 돌 때 KST 요일이 토요일이면 아카이브 자동 갱신 켬.
        # 수동 실행(workflow_dispatch)은 MONTH_TAG로 제어하므로 여기선 제외.
        if: steps.skipcheck.outputs.skip != 'yes'
        run: |
          DOW=$(TZ='Asia/Seoul' date +%u)   # 1=월 … 6=토, 7=일
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$DOW" = "6" ]; then
            echo "AUTO_ARCHIVE=yes" >> "$GITHUB_ENV"
            echo "→ KST 토요일: 아카이브 자동 갱신 ON"
          else
            echo "→ 아카이브 자동 갱신 OFF"
          fi

      - name: 광고 데이터 수집 및 HTML 생성
        if: steps.skipcheck.outputs.skip != 'yes'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_USER_IDS: ${{ secrets.SLACK_DM_USER_IDS }}
          MONTH_TAG: ${{ github.event.inputs.month_tag }}
          MEDIA_MODE: ${{ github.event.inputs.media_mode }}
          DATE_START: ${{ github.event.inputs.date_start }}
          DATE_STOP: ${{ github.event.inputs.date_stop }}
          # AUTO_ARCHIVE는 위 단계에서 토요일에만 설정됨 (없으면 비어있음 = 아카이브 안 함)
        run: python fetch_ads.py

      - name: 결과 커밋 & 푸시
        if: steps.skipcheck.outputs.skip != 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A index.html archive.json images/
          if [ -f tabs_cache.json ]; then git add tabs_cache.json; fi
          if [ -f fire_seen.json ]; then git add fire_seen.json; fi
          if [ -f alert_sent.json ]; then git add alert_sent.json; fi
          TAG="${{ github.event.inputs.month_tag }}"
          [ -z "$TAG" ] && TAG="자동갱신"
          git diff --staged --quiet || git commit -m "chore: [$TAG] 광고 아카이브 업데이트 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          git push
