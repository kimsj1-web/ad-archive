name: 광고 아카이브 자동 업데이트

on:
  schedule:
    # ── 오후 2시 KST(=05:00 UTC): 일광고비·순위 탭만 갱신 (아카이브는 그대로) ──
    - cron: "0 5 * * *"
    # ── 오전 7시 KST(=22:00 UTC): 고효율 아카이브(최근 3개월) + 일광고비·순위 모두 갱신 ──
    # 이 스케줄로 돌 때만 아카이브를 새로 수집한다.
    - cron: "0 22 * * *"

  # ── 수동 실행: 과거 월 아카이빙 등 특정 월 지정용 ──
  workflow_dispatch:
    inputs:
      month_tag:
        description: "월 태그 (예: 26.05) 또는 범위 (예: 26.01~26.05, 최신 달부터 자동 진행) — 비우면 일광고비·순위 탭만 갱신"
        required: false
        default: ""
      media_mode:
        description: "수집 유형 — image(이미지만) / video(영상만) / all(둘 다)"
        required: false
        default: "all"
      date_start:
        description: "성과 조회 시작일 (YYYY-MM-DD) — 비우면 MONTH_TAG 기준 월 1일~오늘"
        required: false
        default: ""
      date_stop:
        description: "성과 조회 종료일 (YYYY-MM-DD)"
        required: false
        default: ""

jobs:
  update-archive:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 광고 데이터 수집 및 HTML 생성
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MONTH_TAG: ${{ github.event.inputs.month_tag }}
          MEDIA_MODE: ${{ github.event.inputs.media_mode }}
          DATE_START: ${{ github.event.inputs.date_start }}
          DATE_STOP: ${{ github.event.inputs.date_stop }}
          # 오전 7시 KST(22:00 UTC) 스케줄로 돌 때만 아카이브 자동 갱신 켜짐
          AUTO_ARCHIVE: ${{ github.event.schedule == '0 22 * * *' && 'yes' || '' }}
        run: python fetch_ads.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html archive.json images/
          if [ -f tabs_cache.json ]; then git add tabs_cache.json; fi
          if [ -f fire_seen.json ]; then git add fire_seen.json; fi
          TAG="${{ github.event.inputs.month_tag }}"
          [ -z "$TAG" ] && TAG="자동갱신"
          git diff --staged --quiet || git commit -m "chore: [$TAG] 광고 아카이브 업데이트 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          git push
